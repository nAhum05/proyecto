<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - NIX</title>
  <link rel="icon" type="image/png" href="../images/LunaLogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #000000;
      --panel: #07090e;
      --line: rgba(253, 213, 126, 0.14);
      --gold: #c8961a;
      --gold-light: #fdd57e;
      --navy: #28566e;
      --navy-deep: #0b1a26;
      --cream: #f6efdc;
      --muted: #8c98a4;
      --focus: #fdd57e;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* ---------- Cortina de transición entre páginas ---------- */
    .curtain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(circle at 70% 20%, rgba(253,213,126,0.18), transparent 45%),
        linear-gradient(315deg, var(--navy-deep), var(--navy));
      transform: translateX(0);
      transition: transform 0.55s cubic-bezier(.76,0,.24,1);
    }
    .curtain.reveal { transform: translateX(100%); }

    .auth-shell {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 40px 80px -30px rgba(200, 150, 26, 0.3);
    }

    /* ---------- Panel de marca (izquierda) ---------- */
    .brand {
      position: relative;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 80% 15%, rgba(253,213,126,0.16), transparent 45%),
        radial-gradient(circle at 20% 85%, rgba(255,255,255,0.07), transparent 50%),
        linear-gradient(200deg, var(--navy) 0%, var(--navy-deep) 60%, #000 100%);
      overflow: hidden;
      color: #fff;
    }

    .brand svg.mesh { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.45; }

    .brand .moon-bg {
      position: absolute;
      left: -70px;
      bottom: -70px;
      width: 300px;
      height: 300px;
      opacity: 0.16;
      pointer-events: none;
    }

    .brand-mark { display: flex; align-items: center; gap: 14px; z-index: 2; }
    .brand-mark img { width: 44px; height: 44px; border-radius: 50%; display: block; }
    .brand-mark span {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }

    .brand-copy { z-index: 1; margin: 40px 0; }
    .brand-copy h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(28px, 3.6vw, 36px);
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 14px;
      letter-spacing: -0.02em;
    }
    .brand-copy p {
      color: rgba(255,255,255,0.78);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 32ch;
      margin: 0 0 26px;
    }

    .btn-outline {
      z-index: 1;
      background: transparent;
      border: 1.5px solid var(--gold-light);
      color: var(--gold-light);
      padding: 11px 28px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      align-self: flex-start;
      transition: background 0.15s;
    }
    .btn-outline:hover { background: rgba(253,213,126,0.12); }

    .brand-foot {
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
    }

    /* ---------- Lado del formulario (derecha) ---------- */
    .form-side {
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-side h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 6px;
    }

    .form-side .sub {
      color: var(--muted);
      font-size: 13.5px;
      margin: 0 0 26px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(246, 239, 220, 0.85);
      margin-bottom: 6px;
    }

    .field { margin-bottom: 16px; }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .input-wrap { position: relative; }

    .input-wrap i.icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 13.5px;
    }

    input.field-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 11px 13px 11px 38px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    input.field-control::placeholder { color: #566270; }

    input.field-control:focus {
      border-color: var(--focus);
      background: rgba(253, 213, 126, 0.05);
    }

    /* Evita el fondo azul claro del autocompletado del navegador */
    input.field-control:-webkit-autofill,
    input.field-control:-webkit-autofill:hover,
    input.field-control:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #11151c inset;
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      transition: background-color 9999s ease-in-out 0s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8) sepia(1) saturate(3) hue-rotate(5deg); }

    .btn-primary {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      color: #1a1200;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      cursor: pointer;
      margin-top: 4px;
      transition: filter 0.15s, transform 0.15s;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:active { transform: scale(0.99); }

    .foot-link, .foot-link-mobile {
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
      margin: 22px 0 0;
    }
    .foot-link a, .foot-link-mobile a { color: var(--focus); font-weight: 600; text-decoration: none; }
    .foot-link-mobile { display: none; }

    @media (max-width: 860px) {
      .auth-shell { grid-template-columns: 1fr; }
      .brand { display: none; }
      .form-side { padding: 40px 28px; }
      .foot-link { display: none; }
      .foot-link-mobile { display: block; }
    }
  </style>
</head>
<body>

  <div class="curtain" id="curtain"></div>

  <div class="auth-shell">

    <div class="brand">
      <svg class="mesh" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
        <g stroke="rgba(253,213,126,0.45)" stroke-width="1">
          <line x1="370" y1="60" x2="260" y2="130"/>
          <line x1="260" y1="130" x2="140" y2="90"/>
          <line x1="260" y1="130" x2="290" y2="260"/>
          <line x1="140" y1="90" x2="30" y2="160"/>
          <line x1="290" y1="260" x2="170" y2="320"/>
          <line x1="170" y1="320" x2="30" y2="160"/>
          <line x1="170" y1="320" x2="220" y2="440"/>
          <line x1="290" y1="260" x2="360" y2="400"/>
        </g>
        <g fill="#ffffff">
          <circle cx="370" cy="60" r="3"/>
          <circle cx="260" cy="130" r="4"/>
          <circle cx="140" cy="90" r="3"/>
          <circle cx="30" cy="160" r="3"/>
          <circle cx="290" cy="260" r="4"/>
          <circle cx="170" cy="320" r="3"/>
          <circle cx="220" cy="440" r="3"/>
          <circle cx="360" cy="400" r="2.5"/>
        </g>
        <g fill="#fdd57e">
          <path transform="translate(330 30)" d="M0,-12 L2.5,-2.5 L12,0 L2.5,2.5 L0,12 L-2.5,2.5 L-12,0 L-2.5,-2.5Z"/>
          <path transform="translate(340 330)" d="M0,-9 L2,-2 L9,0 L2,2 L0,9 L-2,2 L-9,0 L-2,-2Z"/>
          <path transform="translate(70 380)" d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6Z"/>
        </g>
      </svg>

      <img class="moon-bg" src="../images/LunaLogo.png" alt="">

      <div class="brand-mark">
        <img src="../images/LunaLogo.png" alt="Luna NIX">
        <span>NIX</span>
      </div>

      <div class="brand-copy">
        <h1>Crea tu espacio hoy.</h1>
        <p>Únete a una comunidad enfocada en compartir ideas de forma segura y en tiempo real.</p>
        <button class="btn-outline" onclick="goTo('login.html')">¿Ya tienes cuenta? Inicia sesión</button>
      </div>

      <div class="brand-foot">
    
      </div>
    </div>

    <div class="form-side">
      <h2>Crear una cuenta</h2>
      <p class="sub">Completa el formulario para unirte a la red.</p>

      <form id="registerForm">
        <div class="field-grid">
          <div>
            <label for="firstName">Nombre</label>
            <div class="input-wrap">
              <i class="fa-regular fa-user icon"></i>
              <input type="text" class="field-control" id="firstName" placeholder="Carlos" required>
            </div>
          </div>
          <div>
            <label for="lastName">Apellido</label>
            <div class="input-wrap">
              <i class="fa-regular fa-user icon"></i>
              <input type="text" class="field-control" id="lastName" placeholder="Pérez" required>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="birthDate">Fecha de nacimiento</label>
          <div class="input-wrap">
            <i class="fa-regular fa-calendar icon"></i>
            <input type="date" class="field-control" id="birthDate" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope icon"></i>
            <input type="email" class="field-control" id="email" placeholder="carlos@ejemplo.com" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock icon"></i>
            <input type="password" class="field-control" id="password" placeholder="Mínimo 6 caracteres" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">Registrar cuenta</button>

        <p class="foot-link">
          ¿Ya tienes cuenta? <a href="login.html" onclick="event.preventDefault(); goTo('login.html');">Inicia sesión</a>
        </p>
        <p class="foot-link-mobile">
          ¿Ya tienes cuenta? <a href="login.html" onclick="event.preventDefault(); goTo('login.html');">Inicia sesión</a>
        </p>
      </form>
    </div>

  </div>

  <script>
    const curtain = document.getElementById('curtain');
    window.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => curtain.classList.add('reveal'));
    });
    function goTo(url) {
      curtain.classList.remove('reveal');
      setTimeout(() => { window.location.href = url; }, 500);
    }
  </script>
  <script src="../JS/register.js"></script>
</body>
</html>
