<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Red Social</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f8fafc;
    }
    .auth-container {
      max-width: 1000px;
      width: 90%;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .brand-side {
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #6366f1 100%);
      position: relative;
      overflow: hidden;
    }
    .brand-side::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      top: -50%;
      left: -50%;
    }
    .form-control {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 12px;
    }
    .form-control:focus {
      background-color: rgba(15, 23, 42, 0.9);
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }
    .form-control::placeholder {
      color: #64748b;
    }
    /* Estilo para ajustar el icono del selector de fecha en dark mode */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      color: white;
      padding: 0.8rem;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      color: white;
    }
  </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="auth-container">
    <div class="glass-card">
      <div class="row g-0">
        
        <div class="col-lg-6 brand-side d-none d-lg-flex flex-column justify-content-between p-5 position-relative">
          <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-rocket fa-xl text-white"></i>
            <span class="fw-bold fs-4 text-white">X-App</span>
          </div>
          
          <div class="my-auto py-5">
            <h1 class="display-5 fw-bold text-white mb-3">Crea tu espacio hoy.</h1>
            <p class="text-white-50 lead fs-6">Únete a miles de usuarios compartiendo ideas, creando tendencias y construyendo comunidad.</p>
          </div>

          <div class="text-white-50 small">
            &copy; 2026 Proyecto Universitario. Todos los derechos reservados.
          </div>
        </div>

        <div class="col-lg-6 p-4 p-sm-5 d-flex flex-column justify-content-center">
          <div class="mb-4">
            <h3 class="fw-bold text-white mb-1">Crear una cuenta ✨</h3>
            <p class="text-secondary small">Completa el formulario para unirte a la red.</p>
          </div>

          <form id="registerForm">
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label text-slate-300 small fw-medium">Nombre</label>
                <input type="text" class="form-control" id="firstName" placeholder="Carlos" required>
              </div>
              <div class="col-md-6">
                <label class="form-label text-slate-300 small fw-medium">Apellido</label>
                <input type="text" class="form-control" id="lastName" placeholder="Pérez" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label text-slate-300 small fw-medium">Fecha de Nacimiento</label>
              <input type="date" class="form-control" id="birthDate" required>
            </div>

            <div class="mb-3">
              <label class="form-label text-slate-300 small fw-medium">Correo Electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="carlos@ejemplo.com" required>
            </div>

            <div class="mb-4">
              <label class="form-label text-slate-300 small fw-medium">Contraseña</label>
              <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="submit" class="btn btn-gradient w-100 mb-3">
              Registrar Cuenta
            </button>

            <p class="text-center text-secondary small mb-0">
              ¿Ya tienes cuenta? <a href="login.html" class="fw-semibold text-decoration-none" style="color: #60a5fa;">Inicia sesión</a>
            </p>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="../JS/register.js"></script>
</body>
</html>
