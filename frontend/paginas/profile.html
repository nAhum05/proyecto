<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Red Social</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Tipografía Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --input-bg: rgba(15, 23, 42, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-indigo: #6366f1;
      --accent-purple: #8b5cf6;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Navbar Glassmorphism */
    .app-header {
      background: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .brand-logo:hover {
      color: #ffffff;
      opacity: 0.9;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Botones Nav */
    .nav-btn {
      color: #cbd5e1;
      border: 1px solid transparent;
      padding: 0.4rem 0.85rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .nav-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
    }

    .nav-btn-danger {
      color: #f87171;
    }

    .nav-btn-danger:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.2);
    }

    /* Tarjetas principales estilo Cristal */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    /* Avatar del usuario */
    .avatar-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #ffffff;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }

    /* Controles de Formulario */
    .form-control-custom {
      background-color: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control-custom:focus {
      background-color: rgba(15, 23, 42, 0.9);
      border-color: var(--accent-indigo);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    /* Botón Gradiente */
    .btn-gradient {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      border: none;
      color: white;
      padding: 0.65rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      color: white;
    }

    /* Botón Zona de Peligro */
    .btn-outline-danger-custom {
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-outline-danger-custom:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #ffffff;
    }

    .role-badge {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.2rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Navegación Superior -->
  <header class="app-header sticky-top mb-4 py-3">
    <div class="container d-flex align-items-center justify-content-between" style="max-width: 720px;">
      <a class="brand-logo d-flex align-items-center gap-2 fs-5" href="feed.html">
        <i class="fa-solid fa-bolt brand-icon fs-4"></i>
        <span>X-App</span>
      </a>
      <nav class="d-flex align-items-center gap-1">
        <a href="feed.html" class="nav-btn"><i class="fa-solid fa-house me-2"></i>Inicio</a>
        <a href="profile.html" class="nav-btn"><i class="fa-regular fa-user me-2"></i>Perfil</a>
        <button id="btnLogout" class="btn nav-btn nav-btn-danger"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Salir</button>
      </nav>
    </div>
  </header>

  <!-- Contenido Central -->
  <main class="container" style="max-width: 720px;">

    <!-- Tarjeta de Información General -->
    <section class="glass-card">
      <div class="d-flex align-items-center gap-4">
        <div class="avatar-wrapper flex-shrink-0">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="flex-grow-1">
          <div class="d-flex align-items-center gap-2 mb-1">
            <h3 class="fw-bold mb-0 text-white">
              <span id="lblFirstName">Cargando...</span> <span id="lblLastName"></span>
            </h3>
            <span id="lblRole" class="role-badge ms-1">usuario</span>
          </div>
          <p id="lblEmail" class="text-secondary mb-0 small">correo@ejemplo.com</p>
        </div>
      </div>
    </section>

    <section id="editSection" class="glass-card" style="display: none;">
      <div class="section-title"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Información</div>
      <form id="formUpdateProfile">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-secondary small fw-medium">Nombre</label>
            <input type="text" id="editFirstName" class="form-control form-control-custom" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-secondary small fw-medium">Apellido</label>
            <input type="text" id="editLastName" class="form-control form-control-custom">
          </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-gradient">
            Guardar cambios
          </button>
          <button id="btnDeleteAccount" type="button" class="btn btn-outline-danger-custom">
            Eliminar cuenta
          </button>
        </div>
      </form>
    </section>

  </main>

  <script src="../JS/profile.js"></script>
</body>
</html>
