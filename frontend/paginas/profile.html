<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - NIX</title>
  <link rel="icon" type="image/png" href="../images/LunaLogo.png">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Sin animaciones ni transiciones en toda la página */
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }

    :root {
      --bg: #000000;
      --panel: #07090e;
      --input-bg: rgba(255, 255, 255, 0.03);
      --line: rgba(253, 213, 126, 0.14);
      --gold: #c8961a;
      --gold-light: #fdd57e;
      --navy: #28566e;
      --navy-deep: #0b1a26;
      --cream: #f6efdc;
      --muted: #8c98a4;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--cream);
      min-height: 100vh;
    }

    /* ---------- Barra superior ---------- */
    .app-header {
      background: #000;
      border-bottom: 1px solid var(--line);
    }

    .brand-logo {
      color: var(--gold-light);
      text-decoration: none;
    }
    .brand-logo:hover { color: var(--gold-light); }

    .brand-logo img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: block;
    }

    .brand-logo span {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
    }

    .nav-btn {
      color: var(--cream);
      border: 1px solid transparent;
      padding: 0.4rem 0.85rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      background: transparent;
    }
    .nav-btn:hover {
      color: var(--gold-light);
      background: rgba(253, 213, 126, 0.08);
      border-color: var(--line);
    }
    .nav-btn.active { color: var(--gold-light); }

    .nav-btn-danger { color: #f87171; }
    .nav-btn-danger:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.25);
    }

    /* ---------- Tarjetas ---------- */
    .glass-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 30px 60px -35px rgba(200, 150, 26, 0.3);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    /* ---------- Avatar ---------- */
    .avatar-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #1a1200;
      box-shadow: 0 0 0 4px var(--navy);
    }

    .profile-name {
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
    }

    .profile-email { color: var(--muted); }

    .role-badge {
      background: rgba(40, 86, 110, 0.35);
      color: var(--gold-light);
      border: 1px solid rgba(253, 213, 126, 0.35);
      padding: 0.2rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* ---------- Formulario ---------- */
    .form-label {
      color: rgba(246, 239, 220, 0.85);
      font-size: 0.85rem;
      font-weight: 500;
    }

    .form-control-custom {
      background-color: var(--input-bg);
      border: 1px solid var(--line);
      color: #ffffff;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
    }
    .form-control-custom:focus {
      background-color: rgba(253, 213, 126, 0.05);
      border-color: var(--gold-light);
      color: #ffffff;
      box-shadow: none;
      outline: none;
    }

    /* Evita el fondo azul claro del autocompletado */
    .form-control-custom:-webkit-autofill,
    .form-control-custom:-webkit-autofill:hover,
    .form-control-custom:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #11151c inset;
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
    }

    /* ---------- Botones ---------- */
    .btn-gradient {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none;
      color: #1a1200;
      padding: 0.65rem 1.5rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .btn-gradient:hover {
      color: #1a1200;
      filter: brightness(1.08);
    }

    .btn-outline-danger-custom {
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-outline-danger-custom:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Navegación Superior -->
  <header class="app-header sticky-top mb-4 py-3">
    <div class="container d-flex align-items-center justify-content-between" style="max-width: 720px;">
      <a class="brand-logo d-flex align-items-center gap-2" href="feed.html">
        <img src="../images/LunaLogo.png" alt="Luna NIX">
        <span>NIX</span>
      </a>
      <nav class="d-flex align-items-center gap-1">
        <a href="feed.html" class="nav-btn"><i class="fa-solid fa-house me-2"></i>Inicio</a>
        <a href="profile.html" class="nav-btn active"><i class="fa-regular fa-user me-2"></i>Perfil</a>
        <button id="btnLogout" class="btn nav-btn nav-btn-danger"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Salir</button>
      </nav>
    </div>
  </header>

  <!-- Contenido Central -->
  <main class="container" style="max-width: 720px;">

    <!-- Tarjeta de Información General -->
    <section class="glass-card">
      <div class="d-flex align-items-center gap-4">
        <div class="avatar-wrapper flex-shrink-0">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="flex-grow-1">
          <div class="d-flex align-items-center gap-2 mb-1">
            <h3 class="profile-name fw-bold mb-0">
              <span id="lblFirstName">Cargando...</span> <span id="lblLastName"></span>
            </h3>
            <span id="lblRole" class="role-badge ms-1">usuario</span>
          </div>
          <p id="lblEmail" class="profile-email mb-0 small">correo@ejemplo.com</p>
        </div>
      </div>
    </section>

    <section id="editSection" class="glass-card" style="display: none;">
      <div class="section-title"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Información</div>
      <form id="formUpdateProfile">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" id="editFirstName" class="form-control form-control-custom" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Apellido</label>
            <input type="text" id="editLastName" class="form-control form-control-custom">
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button type="submit" class="btn btn-gradient">
            Guardar cambios
          </button>
          <button id="btnDeleteAccount" type="button" class="btn btn-outline-danger-custom">
            Eliminar cuenta
          </button>
        </div>
      </form>
    </section>

    <!-- Tu profile.js hace getElementById('dangerSection'); este elemento debe existir
         para que el script no falle antes de llenar los campos de edición. -->
    <div id="dangerSection" style="display: none;"></div>

  </main>

  <script src="../JS/profile.js"></script>
</body>
</html>
