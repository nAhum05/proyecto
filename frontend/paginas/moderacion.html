<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderación - X-App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
    }
    .navbar-custom {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.8rem 0;
    }
    .navbar-custom .brand { color: #fff; font-weight: 700; font-size: 1.3rem; }
    .navbar-custom a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 15px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    .navbar-custom a:hover { color: #818cf8; }

    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .report-card {
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }
    .report-card h5 { color: #fff; margin-bottom: 0.5rem; }
    .report-card p { color: #cbd5e1; font-size: 0.9rem; }
    .report-card small { color: #818cf8; }

    .badge-pendiente {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-gradient {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .btn-gradient:hover { transform: translateY(-2px); color: #fff; }

    .btn-danger-soft {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn-danger-soft:hover { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }

    .btn-warning-soft {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #facc15;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn-warning-soft:hover { background: rgba(234, 179, 8, 0.25); color: #fde047; }

    #mensaje { color: #f87171; text-align: center; font-size: 0.9rem; margin-top: 10px; }
  </style>
</head>
<body>

  <nav class="navbar-custom">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="brand"><i class="fa-solid fa-bolt text-primary me-1"></i> X-App</div>
      <div>
        <a href="inicio.html"><i class="fa-solid fa-house me-1"></i> Inicio</a>
        <a href="perfil.html"><i class="fa-regular fa-user me-1"></i> Perfil</a>
        <a href="moderacion.html" id="linkModeracion" style="display:none;">
          <i class="fa-solid fa-shield-halved me-1"></i> Reportes
      </a>
        <a href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket me-1"></i> Salir</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold"><i class="fa-solid fa-shield-halved me-2"></i>Buzón de Reportes</h2>
      <span class="badge-pendiente" id="contadorPendientes">0 pendientes</span>
    </div>

    <div id="listaReportes"></div>
    <div id="mensaje"></div>
  </div>

  <script src="../JS/moderacion.js"></script>
</body>
</html>
