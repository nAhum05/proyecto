<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - X-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar-custom {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem 0;
        }

        .navbar-custom .brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .navbar-custom a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .navbar-custom a:hover {
            color: #818cf8;
        }

        /* Tarjeta comunidad */
        .community-card {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.5rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .community-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.35);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .community-card h4 {
            color: #fff;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .community-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .community-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        /* Botones */
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* Inputs */
        .form-control,
        .form-select {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 0.7rem 1rem;
            border-radius: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        /* Vista de comunidad */
        .community-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 18px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .community-header h2 {
            color: #fff;
            font-weight: 700;
            margin: 0;
        }

        .community-header p {
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
        }

        /* Post */
        .post-card {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }

        .post-card h5 {
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .post-card p {
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .post-card small {
            color: #818cf8;
        }

        /* Ocultar vistas */
        .vista {
            display: none;
        }

        .vista.activa {
            display: block;
        }

        #mensaje {
            color: #f87171;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Avatars apilados */
        .avatar-stack {
            display: flex;
            align-items: center;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #0f172a;
            margin-left: -10px;
        }

        .avatar-circle:first-child {
            margin-left: 0;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand">
                <i class="fa-solid fa-bolt text-primary me-1"></i> X-App
            </div>
            <div>
                <a href="inicio.html"><i class="fa-solid fa-house me-1"></i> Inicio</a>
                <a href="perfil.html"><i class="fa-regular fa-user me-1"></i> Mi Perfil</a>
                <a href="moderacion.html" id="linkModeracion" style="display:none;">
                    <i class="fa-solid fa-shield-halved me-1"></i> Reportes
                </a>
                <a href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket me-1"></i> Salir</a>
            </div>

        </div>
    </nav>

    <div class="container py-4">

        <!-- ================= VISTA 1: COMUNIDADES ================= -->
        <div id="vistaComunidades" class="vista activa">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold">Explorar Comunidades</h2>
                <button class="btn-gradient" data-bs-toggle="modal" data-bs-target="#modalCrearComunidad">
                    <i class="fa-solid fa-plus me-1"></i> Crear Comunidad
                </button>
            </div>

            <div class="row g-4" id="listaComunidades">
                <!-- Aquí se pintan las tarjetas de comunidades -->
            </div>
        </div>

        <!-- ================= VISTA 2: COMUNIDAD ESPECÍFICA ================= -->
        <div id="vistaComunidad" class="vista">
            <button class="btn-ghost mb-3" id="btnVolver">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver a comunidades
            </button>

            <div class="community-header">
                <h2 id="tituloComunidad">Nombre de la comunidad</h2>
                <p id="descripcionComunidad"></p>
            </div>

            <div class="row g-4">
                <!-- Formulario crear post -->
                <div class="col-lg-4">
                    <div class="post-card">
                        <h5><i class="fa-solid fa-pen me-2"></i>Crear Publicación</h5>
                        <form id="formPost">
                            <input type="text" id="tituloPost" class="form-control mb-2" placeholder="Título" required>
                            <textarea id="contenidoPost" class="form-control mb-2" placeholder="¿Qué estás pensando?"
                                rows="4" required></textarea>
                            <button type="submit" class="btn-gradient w-100">Publicar</button>
                        </form>
                    </div>

                    <div class="post-card mb-3">
                        <h5><i class="fa-solid fa-users me-2"></i>Miembros (<span id="contadorMiembros">0</span>)</h5>
                        <div id="listaMiembros" class="d-flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Lista de posts -->
                <div class="col-lg-8">
                    <div id="listaPosts"></div>
                </div>
            </div>
        </div>

        <div id="mensaje"></div>
    </div>

    <!-- ================= MODAL CREAR COMUNIDAD ================= -->
    <div class="modal fade" id="modalCrearComunidad" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="background:#111827; border:1px solid rgba(255,255,255,0.1); border-radius:18px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">Crear Comunidad</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formComunidad">
                        <input type="text" id="nombreComunidad" class="form-control mb-2"
                            placeholder="Nombre de la comunidad" required>
                        <input type="text" id="descripcionComunidadInput" class="form-control mb-3"
                            placeholder="Descripción breve">
                        <button type="submit" class="btn-gradient w-100">Crear</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para reportar -->
    <div class="modal fade" id="modalReportar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="background:#111827; border:1px solid rgba(255,255,255,0.1); border-radius:18px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">
                        Reportar Publicación
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formReportar">
                        <input type="hidden" id="reportePostId">
                        <label class="form-label text-secondary small">Motivo del reporte</label>
                        <textarea id="reporteMotivo" class="form-control mb-3" rows="3"
                            placeholder="Explica por qué estás reportando esto..." required></textarea>

                        <div id="mensajeReporte" class="small mb-2"></div>

                        <button type="submit" class="btn-gradient w-100">
                            <i class="fa-solid fa-paper-plane me-1"></i> Enviar Reporte
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/inicio.js"></script>
</body>

</html>
