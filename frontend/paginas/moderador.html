<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Moderador - NIX</title>
  <link rel="icon" type="image/png" href="../images/LunaLogo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    .btn, .table-card * { transition: none !important; }

    /* ---------- SweetAlert2 con la paleta NIX ---------- */
    .swal2-popup.swal-nix {
      background: #07090e;
      color: var(--cream);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 30px 70px -20px rgba(200, 150, 26, 0.35);
      font-family: 'Inter', sans-serif;
    }
    .swal-nix .swal2-title {
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      font-size: 1.4rem;
    }
    .swal-nix .swal2-html-container { color: var(--muted); }

    .swal-nix-confirm {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #1a1200;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
      font-weight: 700;
      font-size: 0.9rem;
      margin: 0 0.3rem;
    }
    .swal-nix-confirm:hover { filter: brightness(1.08); }

    .swal-nix-cancel {
      background: transparent;
      color: var(--cream);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      font-size: 0.9rem;
      margin: 0 0.3rem;
    }
    .swal-nix-cancel:hover { background: rgba(255, 255, 255, 0.05); }

    .swal-nix .swal2-icon.swal2-success { border-color: var(--gold-light); color: var(--gold-light); }
    .swal-nix .swal2-icon.swal2-success [class^='swal2-success-line'] { background-color: var(--gold-light); }
    .swal-nix .swal2-icon.swal2-success .swal2-success-ring { border-color: rgba(253, 213, 126, 0.3); }
    .swal-nix .swal2-icon.swal2-success [class^='swal2-success-circular-line'] { background: transparent; }
    .swal-nix .swal2-icon.swal2-warning,
    .swal-nix .swal2-icon.swal2-question { border-color: var(--gold-light); color: var(--gold-light); }
    .swal-nix .swal2-timer-progress-bar { background: var(--gold-light); }

    :root {
      --bg: #000000;
      --panel: #07090e;
      --panel-alt: #0b0e15;
      --line: rgba(253, 213, 126, 0.14);
      --line-soft: rgba(255, 255, 255, 0.06);
      --gold: #c8961a;
      --gold-light: #fdd57e;
      --navy: #28566e;
      --navy-deep: #0b1a26;
      --cream: #f6efdc;
      --muted: #8c98a4;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(40, 86, 110, 0.28), transparent 55%),
        var(--bg);
      background-attachment: fixed;
      color: var(--cream);
      min-height: 100vh;
    }

    /* ---------- Barra superior ---------- */
    .app-header {
      background: #000;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: block;
    }
    .brand .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      line-height: 1;
    }
    .brand .role {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border-left: 1px solid var(--line);
      padding-left: 12px;
      margin-left: 2px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #f87171;
      border-radius: 10px;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .btn-logout:hover {
      background: rgba(248, 113, 113, 0.1);
      border-color: #f87171;
      color: #fca5a5;
    }

    /* ---------- Encabezado de sección ---------- */
    .page-head {
      border-bottom: 1px solid var(--line);
      padding-bottom: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .page-eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }
    .page-head h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      color: #fff;
      margin: 0 0 0.35rem;
    }
    .page-head p {
      color: var(--muted);
      margin: 0;
      font-size: 0.95rem;
    }

    /* ---------- Tabla ---------- */
    .table-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 60px -35px rgba(200, 150, 26, 0.3);
    }

    .table-card .table {
      --bs-table-bg: transparent;
      --bs-table-color: var(--cream);
      --bs-table-striped-bg: transparent;
      --bs-table-hover-bg: rgba(253, 213, 126, 0.05);
      --bs-table-hover-color: var(--cream);
      --bs-table-border-color: var(--line-soft);
      margin: 0;
      color: var(--cream);
    }

    .table-card thead th {
      background: var(--navy-deep);
      color: var(--gold-light);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      border-top: none;
    }

    .table-card tbody td {
      padding: 0.9rem 1.25rem;
      vertical-align: middle;
      font-size: 0.93rem;
      border-bottom: 1px solid var(--line-soft);
      background: transparent;
      color: var(--cream) !important;
    }

    /* Corrección para que las fechas y textos secundarios sean visibles */
    .table-card tbody td small {
      color: var(--muted) !important;
    }

    .table-card tbody tr:last-child td { border-bottom: none; }
    .table-card tbody tr:hover td { background: rgba(253, 213, 126, 0.05); }

    .table-card tbody td:nth-child(1) { color: #fff; font-weight: 500; }
    .table-card tbody td:nth-child(2) { color: var(--muted); }

    /* ---------- Botones de acción ---------- */
    .table-card .btn {
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
    }

    .table-card .btn-danger {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .table-card .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #fff;
    }

    .table-card .btn-success {
      background: rgba(253, 213, 126, 0.08);
      border: 1px solid rgba(253, 213, 126, 0.4);
      color: var(--gold-light);
    }
    .table-card .btn-success:hover {
      background: rgba(253, 213, 126, 0.18);
      border-color: var(--gold-light);
      color: #fff;
    }

    .table-card .btn-warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
    }
    .table-card .btn-warning:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      color: #fff;
    }

    @media (max-width: 768px) {
      .brand .role { display: none; }
      .table-card thead th, .table-card tbody td { padding: 0.75rem 0.85rem; }
    }
  </style>
</head>
<body>

  <!-- Barra superior -->
  <header class="app-header py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="brand">
        <img src="../images/LunaLogo.png" alt="Luna NIX">
        <span class="name">NIX</span>
        <span class="role">Panel de moderador</span>
      </div>
      <button id="logoutBtn" class="btn btn-logout">
        <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Cerrar sesión
      </button>
    </div>
  </header>

  <!-- Contenido -->
  <main class="container py-5">

    <div class="page-head">
      <div class="page-eyebrow">Administración</div>
      <h1>Usuarios</h1>
      <p>Consulta y administra el estado de los usuarios registrados.</p>
    </div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Último Acceso</th>
              <th>Fecha Baneo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../JS/moderador.js"></script>
</body>
</html>
