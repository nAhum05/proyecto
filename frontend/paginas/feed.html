<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - NIX</title>
  <link rel="icon" type="image/png" href="../images/LunaLogo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Sin transiciones en la interfaz (el ícono de "cargando" sí gira) */
    .btn, .nav-btn, .search-input, .post-card, .dropdown-item-btn,
    .form-control-custom, .author-link { transition: none !important; }

    /* ---------- SweetAlert2 con la paleta NIX ---------- */
    .swal2-popup.swal-nix {
      background: #07090e;
      color: var(--cream);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 30px 70px -20px rgba(200, 150, 26, 0.35);
      font-family: 'Inter', sans-serif;
    }
    .swal-nix .swal2-title {
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      font-size: 1.4rem;
    }
    .swal-nix .swal2-html-container { color: var(--muted); }

    .swal-nix-confirm {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #1a1200;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
      font-weight: 700;
      font-size: 0.9rem;
      margin: 0 0.3rem;
    }
    .swal-nix-confirm:hover { filter: brightness(1.08); }

    .swal-nix-cancel {
      background: transparent;
      color: var(--cream);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
      font-weight: 600;
      font-size: 0.9rem;
      margin: 0 0.3rem;
    }
    .swal-nix-cancel:hover { background: rgba(255, 255, 255, 0.05); }

    .swal-nix .swal2-icon.swal2-question,
    .swal-nix .swal2-icon.swal2-warning { border-color: var(--gold-light); color: var(--gold-light); }

    /* Aviso pequeño (toast) */
    .swal2-popup.swal2-toast.swal-nix .swal2-title { font-size: 0.95rem; }
    .swal-nix .swal2-icon.swal2-success { border-color: var(--gold-light); color: var(--gold-light); }
    .swal-nix .swal2-icon.swal2-success [class^='swal2-success-line'] { background-color: var(--gold-light); }
    .swal-nix .swal2-icon.swal2-success .swal2-success-ring { border-color: rgba(253, 213, 126, 0.3); }
    .swal-nix .swal2-icon.swal2-success [class^='swal2-success-circular-line'] { background: transparent; }
    .swal-nix .swal2-timer-progress-bar { background: var(--gold-light); }

    :root {
      --bg: #000000;
      --panel: #07090e;
      --input-bg: rgba(255, 255, 255, 0.03);
      --line: rgba(253, 213, 126, 0.14);
      --line-soft: rgba(255, 255, 255, 0.07);
      --gold: #c8961a;
      --gold-light: #fdd57e;
      --navy: #28566e;
      --navy-deep: #0b1a26;
      --cream: #f6efdc;
      --muted: #8c98a4;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--cream);
      min-height: 100vh;
    }

    /* ── Barra superior ── */
    .app-header {
      background: #000;
      border-bottom: 1px solid var(--line);
    }

    .brand-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .brand-logo img {
      width: 34px; height: 34px; border-radius: 50%; display: block;
    }
    .brand-logo span {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 1.35rem;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      line-height: 1;
    }
    .brand-logo:hover span { color: var(--gold-light); }

    /* Enlaces de navegación */
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); border: 1px solid transparent;
      padding: 0.4rem 0.85rem; border-radius: 10px;
      font-size: 0.875rem; font-weight: 500;
      text-decoration: none;
    }
    .nav-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .nav-btn:hover {
      color: var(--gold-light);
      background: rgba(253, 213, 126, 0.08);
      border-color: var(--line);
    }
    .nav-btn.active {
      color: var(--gold-light);
      background: rgba(253, 213, 126, 0.1);
      border-color: var(--line);
    }

    /* Buscador */
    .search-wrap { position: relative; width: 170px; }
    .search-wrap svg {
      position: absolute; left: 11px; top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px; stroke: var(--muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 6px 12px 6px 31px;
      color: #fff; font-family: inherit; font-size: 12.5px;
      outline: none;
    }
    .search-input::placeholder { color: #566270; }
    .search-input:focus {
      border-color: var(--gold-light);
      background: rgba(253, 213, 126, 0.05);
    }

    /* Avatar + menú */
    .avatar-wrap { position: relative; }
    .avatar-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border: none; cursor: pointer;
      box-shadow: 0 0 0 2px var(--navy);
      display: flex; align-items: center; justify-content: center;
      color: #1a1200; font-weight: 700; font-size: 11px;
      font-family: inherit;
    }
    .avatar-dropdown {
      display: none;
      position: absolute; top: calc(100% + 10px); right: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px; padding: 6px;
      min-width: 180px;
      box-shadow: 0 20px 40px -10px rgba(200, 150, 26, 0.3), 0 16px 32px -8px rgba(0, 0, 0, 0.7);
      z-index: 300;
    }
    .avatar-wrap.open .avatar-dropdown { display: block; }
    .dropdown-user { padding: 10px 12px 8px; }
    .dropdown-user-name { font-weight: 600; font-size: 13px; color: #fff; }
    .dropdown-user-role {
      font-size: 11px; color: var(--gold-light); margin-top: 2px;
      letter-spacing: 0.04em;
    }
    .dropdown-divider { height: 1px; background: var(--line); margin: 4px 0; border: 0; opacity: 1; }
    .dropdown-item-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; border-radius: 8px;
      color: var(--cream); font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
      text-decoration: none;
    }
    .dropdown-item-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .dropdown-item-btn:hover { background: rgba(253, 213, 126, 0.08); color: var(--gold-light); }
    .dropdown-item-btn.danger { color: #f87171; }
    .dropdown-item-btn.danger:hover { background: rgba(248, 113, 113, 0.1); color: #fca5a5; }

    /* ── Tarjetas ── */
    .glass-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 30px 60px -35px rgba(200, 150, 26, 0.3);
    }
    .section-title {
      font-size: 0.85rem; font-weight: 700;
      color: var(--gold-light);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    /* Caja de texto */
    .form-control-custom {
      background-color: var(--input-bg);
      border: 1px solid var(--line);
      color: #fff; border-radius: 12px;
      padding: 0.8rem; font-size: 0.95rem;
      resize: none;
    }
    .form-control-custom:focus {
      background-color: rgba(253, 213, 126, 0.05);
      border-color: var(--gold-light); color: #fff;
      box-shadow: none; outline: none;
    }
    .form-control-custom::placeholder { color: #566270; }

    /* Botón publicar */
    .btn-gradient {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border: none; color: #1a1200;
      padding: 0.65rem 1.5rem; border-radius: 10px;
      font-weight: 700; font-size: 0.9rem;
    }
    .btn-gradient:hover { color: #1a1200; filter: brightness(1.08); }

    /* Publicaciones */
    .post-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--navy);
      border-radius: 14px; padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .post-card:hover { border-color: var(--line); border-left-color: var(--gold-light); }
    .author-link { color: #fff; font-weight: 600; text-decoration: none; }
    .author-link:hover { color: var(--gold-light); }
    .role-badge {
      background: rgba(40, 86, 110, 0.35); color: var(--gold-light);
      border: 1px solid rgba(253, 213, 126, 0.35);
      padding: 0.2rem 0.65rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 500;
    }
    .post-content { color: rgba(246, 239, 220, 0.88); font-size: 0.95rem; line-height: 1.6; }

    @media (max-width: 640px) {
      .topbar-nav { display: none !important; }
      .search-wrap { width: 120px; }
    }
  </style>
</head>
<body>

  <!-- Navegación Superior -->
  <header class="app-header sticky-top mb-4 py-2">
    <div class="container d-flex align-items-center gap-2" style="max-width: 860px;">

      <a class="brand-logo me-2" href="feed.html">
        <img src="../images/LunaLogo.png" alt="Luna NIX">
        <span>NIX</span>
      </a>

      <nav class="topbar-nav d-flex align-items-center gap-1">
        <a href="feed.html" class="nav-btn active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Inicio
        </a>
        <a href="profile.html" class="nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Mi perfil
        </a>
        <a id="navModerador" href="moderador.html" class="nav-btn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Moderador
        </a>
        <a id="navAdmin" href="#" class="nav-btn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2m0 16v2M2 12h2m16 0h2"/></svg>
          Administración
        </a>
      </nav>

      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="search-input" type="text" placeholder="Buscar...">
        </div>

        <div class="avatar-wrap" id="avatarWrap">
          <button class="avatar-btn" id="avatarBtn"></button>
          <div class="avatar-dropdown">
            <div class="dropdown-user">
              <div class="dropdown-user-name" id="dropdownName">—</div>
              <div class="dropdown-user-role" id="dropdownRole">usuario</div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="profile.html" class="dropdown-item-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Ver perfil
            </a>
            <div class="dropdown-divider"></div>
            <button id="btnLogout" class="dropdown-item-btn danger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- Contenido Central -->
  <main class="container" style="max-width: 720px;">

    <!-- Crear Publicación -->
    <section class="glass-card">
      <div class="section-title">Subir publicación</div>
      <textarea id="postContent" class="form-control form-control-custom mb-3" rows="3" placeholder="¿Qué estás pensando hoy?"></textarea>
      <div class="d-flex justify-content-end">
        <button id="btnPublish" type="button" class="btn btn-gradient">
          <i class="fa-solid fa-paper-plane me-2"></i>Publicar
        </button>
      </div>
    </section>

    <!-- Publicaciones Recientes -->
    <section class="glass-card">
      <div class="section-title">Feed general</div>
      <div id="postsContainer">
        <div class="text-center text-secondary py-4">
          <i class="fa-solid fa-circle-notch fa-spin me-2" style="color: #fdd57e;"></i>Cargando publicaciones...
        </div>
      </div>
    </section>

  </main>

  <script>
    const _user = JSON.parse(localStorage.getItem('user') || '{}');

    // Iniciales y nombre en el avatar
    if (_user.firstName) {
      const initials = (_user.firstName[0] + (_user.lastName ? _user.lastName[0] : '')).toUpperCase();
      document.getElementById('avatarBtn').textContent = initials;
      document.getElementById('dropdownName').textContent = `${_user.firstName} ${_user.lastName || ''}`.trim();
      document.getElementById('dropdownRole').textContent = _user.role || 'usuario';
    }

    // Mostrar enlaces según rol
    const role = _user.role || 'usuario';
    if (role === 'moderador') {
      document.getElementById('navModerador').hidden = false;
    } else if (role === 'administrador') {
      document.getElementById('navAdmin').hidden = false;
    }

    // Toggle dropdown avatar
    document.getElementById('avatarBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('avatarWrap').classList.toggle('open');
    });
    document.addEventListener('click', () => {
      document.getElementById('avatarWrap').classList.remove('open');
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../JS/feed.js"></script>
</body>
</html>
