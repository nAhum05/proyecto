<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - X-App</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Tipografía Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --input-bg: rgba(15, 23, 42, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-indigo: #6366f1;
      --accent-purple: #8b5cf6;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Navbar Glassmorphism */
    .app-header {
      background: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .brand-logo:hover {
      color: #ffffff;
      opacity: 0.9;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Botones Nav */
    .nav-btn {
      color: #cbd5e1;
      border: 1px solid transparent;
      padding: 0.4rem 0.85rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .nav-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-color);
    }

    .nav-btn-danger {
      color: #f87171;
    }

    .nav-btn-danger:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.2);
    }

    /* Tarjetas principales estilo Cristal */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    /* Controles de Entrada */
    .form-control-custom {
      background-color: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 12px;
      padding: 0.8rem;
      font-size: 0.95rem;
      resize: none;
      transition: all 0.2s ease;
    }

    .form-control-custom:focus {
      background-color: rgba(15, 23, 42, 0.9);
      border-color: var(--accent-indigo);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .form-control-custom::placeholder {
      color: #64748b;
    }

    /* Botón Gradiente idéntico al Login */
    .btn-gradient {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      border: none;
      color: white;
      padding: 0.65rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      color: white;
    }

    /* Estilos del Feed / Post */
    .post-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s ease;
    }

    .post-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .author-link {
      color: #f1f5f9;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .author-link:hover {
      color: #818cf8;
    }

    .role-badge {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .post-content {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Navegación Superior -->
  <header class="app-header sticky-top mb-4 py-3">
    <div class="container d-flex align-items-center justify-content-between" style="max-width: 720px;">
      <a class="brand-logo d-flex align-items-center gap-2 fs-5" href="feed.html">
        <i class="fa-solid fa-bolt brand-icon fs-4"></i>
        <span>X-App</span>
      </a>
      <nav class="d-flex align-items-center gap-1">
        <a href="feed.html" class="nav-btn"><i class="fa-solid fa-house me-2"></i>Inicio</a>
        <a href="profile.html" class="nav-btn"><i class="fa-regular fa-user me-2"></i>Perfil</a>
        <button id="btnLogout" class="btn nav-btn nav-btn-danger"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Cerrar sesión</button>
      </nav>
    </div>
  </header>

  <!-- Contenido Central -->
  <main class="container" style="max-width: 720px;">
    
    <!-- Crear Publicación -->
    <section class="glass-card">
      <div class="section-title">Subir publicación</div>
      <textarea id="postContent" class="form-control form-control-custom mb-3" rows="3" placeholder="¿Qué estás pensando hoy?"></textarea>
      <div class="d-flex justify-content-end">
        <button id="btnPublish" type="button" class="btn btn-gradient">
          <i class="fa-solid fa-paper-plane me-2"></i>Publicar
        </button>
      </div>
    </section>

    <!-- Publicaciones Recientes -->
    <section class="glass-card">
      <div class="section-title">Feed general</div>
      <div id="postsContainer">
        <div class="text-center text-secondary py-4">
          <i class="fa-solid fa-circle-notch fa-spin me-2" style="color: #818cf8;"></i>Cargando publicaciones...
        </div>
      </div>
    </section>

  </main>

  <script src="../JS/feed.js"></script>
</body>
</html>
