<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - X-App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark:     #090d16;
      --card-bg:     rgba(17, 24, 39, 0.75);
      --input-bg:    rgba(15, 23, 42, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-indigo: #6366f1;
      --accent-purple: #8b5cf6;
      --text-muted:  #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .app-header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: #fff;
      font-weight: 700; font-size: 15px;
    }
    .brand-logo:hover { color: #fff; opacity: .9; }
    .brand-bolt {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-bolt svg { width: 14px; height: 14px; fill: #fff; }

    /* Nav links */
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #94a3b8; border: 1px solid transparent;
      padding: 0.4rem 0.85rem; border-radius: 10px;
      font-size: 0.875rem; font-weight: 500;
      transition: all 0.2s ease; text-decoration: none;
    }
    .nav-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .nav-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.05);
      border-color: var(--border-color);
    }
    .nav-btn.active {
      color: var(--accent-indigo);
      background: rgba(99,102,241,0.12);
    }

    /* Buscador */
    .search-wrap { position: relative; width: 160px; }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px; stroke: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 12px 6px 30px;
      color: #fff; font-family: inherit; font-size: 12.5px;
      outline: none; transition: border-color .15s;
    }
    .search-input::placeholder { color: #475569; }
    .search-input:focus { border-color: var(--accent-indigo); }

    /* Avatar + dropdown */
    .avatar-wrap { position: relative; }
    .avatar-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 11px;
      font-family: inherit;
    }
    .avatar-dropdown {
      display: none;
      position: absolute; top: calc(100% + 8px); right: 0;
      background: rgba(17,24,39,0.97);
      border: 1px solid var(--border-color);
      border-radius: 12px; padding: 6px;
      min-width: 170px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 32px -8px rgba(0,0,0,0.6);
      z-index: 300;
    }
    .avatar-wrap.open .avatar-dropdown { display: block; }
    .dropdown-user { padding: 10px 12px 8px; }
    .dropdown-user-name { font-weight: 600; font-size: 13px; color: #f8fafc; }
    .dropdown-user-role { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .dropdown-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
    .dropdown-item-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; border-radius: 8px;
      color: #94a3b8; font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
      transition: background .15s, color .15s; text-decoration: none;
    }
    .dropdown-item-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .dropdown-item-btn:hover { background: rgba(255,255,255,0.05); color: #f8fafc; }
    .dropdown-item-btn.danger { color: #f87171; }
    .dropdown-item-btn.danger:hover { background: rgba(248,113,113,0.08); color: #fca5a5; }

    /* Glass cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }
    .section-title {
      font-size: 0.85rem; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    /* Textarea */
    .form-control-custom {
      background-color: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff; border-radius: 12px;
      padding: 0.8rem; font-size: 0.95rem;
      resize: none; transition: all 0.2s ease;
    }
    .form-control-custom:focus {
      background-color: rgba(15,23,42,0.9);
      border-color: var(--accent-indigo); color: #fff;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.2);
    }
    .form-control-custom::placeholder { color: #64748b; }

    /* Botón publicar */
    .btn-gradient {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
      border: none; color: #fff;
      padding: 0.65rem 1.5rem; border-radius: 12px;
      font-weight: 600; font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(99,102,241,0.4);
      color: #fff;
    }

    /* Post cards */
    .post-card {
      background: rgba(15,23,42,0.4);
      border: 1px solid var(--border-color);
      border-radius: 14px; padding: 1.25rem;
      margin-bottom: 1rem; transition: border-color 0.2s ease;
    }
    .post-card:hover { border-color: rgba(255,255,255,0.15); }
    .author-link { color: #f1f5f9; font-weight: 600; text-decoration: none; transition: color 0.2s; }
    .author-link:hover { color: #818cf8; }
    .role-badge {
      background: rgba(99,102,241,0.15); color: #a5b4fc;
      border: 1px solid rgba(99,102,241,0.3);
      padding: 0.2rem 0.6rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 500;
    }
    .post-content { color: #cbd5e1; font-size: 0.95rem; line-height: 1.6; }

    @media (max-width: 640px) {
      .topbar-nav { display: none !important; }
      .search-wrap { width: 120px; }
    }
  </style>
</head>
<body>

  <!-- Navegación Superior -->
  <header class="app-header sticky-top mb-4 py-2">
    <div class="container d-flex align-items-center gap-2" style="max-width: 860px;">

      <a class="brand-logo me-2" href="feed.html">
        <div class="brand-bolt">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        X-App
      </a>

      <nav class="topbar-nav d-flex align-items-center gap-1">
        <a href="feed.html" class="nav-btn active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Inicio
        </a>
        <a href="profile.html" class="nav-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Mi perfil
        </a>
        <a id="navModerador" href="moderador.html" class="nav-btn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Moderador
        </a>
        <a id="navAdmin" href="#" class="nav-btn" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2m0 16v2M2 12h2m16 0h2"/></svg>
          Administración
        </a>
      </nav>

      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="search-input" type="text" placeholder="Buscar...">
        </div>

        <div class="avatar-wrap" id="avatarWrap">
          <button class="avatar-btn" id="avatarBtn"></button>
          <div class="avatar-dropdown">
            <div class="dropdown-user">
              <div class="dropdown-user-name" id="dropdownName">—</div>
              <div class="dropdown-user-role" id="dropdownRole">usuario</div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="profile.html" class="dropdown-item-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Ver perfil
            </a>
            <div class="dropdown-divider"></div>
            <button id="btnLogout" class="dropdown-item-btn danger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar sesión
            </button>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- Contenido Central -->
  <main class="container" style="max-width: 720px;">

    <!-- Crear Publicación -->
    <section class="glass-card">
      <div class="section-title">Subir publicación</div>
      <textarea id="postContent" class="form-control form-control-custom mb-3" rows="3" placeholder="¿Qué estás pensando hoy?"></textarea>
      <div class="d-flex justify-content-end">
        <button id="btnPublish" type="button" class="btn btn-gradient">
          <i class="fa-solid fa-paper-plane me-2"></i>Publicar
        </button>
      </div>
    </section>

    <!-- Publicaciones Recientes -->
    <section class="glass-card">
      <div class="section-title">Feed general</div>
      <div id="postsContainer">
        <div class="text-center text-secondary py-4">
          <i class="fa-solid fa-circle-notch fa-spin me-2" style="color: #818cf8;"></i>Cargando publicaciones...
        </div>
      </div>
    </section>

  </main>

  <script>
    const _user = JSON.parse(localStorage.getItem('user') || '{}');

    // Iniciales y nombre en el avatar
    if (_user.firstName) {
      const initials = (_user.firstName[0] + (_user.lastName ? _user.lastName[0] : '')).toUpperCase();
      document.getElementById('avatarBtn').textContent = initials;
      document.getElementById('dropdownName').textContent = `${_user.firstName} ${_user.lastName || ''}`.trim();
      document.getElementById('dropdownRole').textContent = _user.role || 'usuario';
    }

    // Mostrar enlaces según rol
    const role = _user.role || 'usuario';
    if (role === 'moderador') {
      document.getElementById('navModerador').hidden = false;
    } else if (role === 'administrador') {
      document.getElementById('navAdmin').hidden = false;
    }

    // Toggle dropdown avatar
    document.getElementById('avatarBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('avatarWrap').classList.toggle('open');
    });
    document.addEventListener('click', () => {
      document.getElementById('avatarWrap').classList.remove('open');
    });
  </script>

  <script src="../JS/feed.js"></script>
</body>
</html>
