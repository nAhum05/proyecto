<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - X-App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar-custom {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem 0;
        }

        .navbar-custom .brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .navbar-custom a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .navbar-custom a:hover {
            color: #818cf8;
        }

        /* Card general */
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.5);
        }

        /* Avatar */
        .avatar-big {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 auto 1rem;
            border: 4px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .avatar-big img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            text-align: center;
            font-weight: 700;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 0.2rem;
        }

        .profile-email {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }

        .profile-bio {
            text-align: center;
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
        }

        /* Inputs */
        .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 0.7rem 1rem;
            border-radius: 12px;
        }

        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-label {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }

        /* Botones */
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            padding: 0.7rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .btn-danger-soft {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.7rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-danger-soft:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Sección de edición */
        .edit-section {
            display: none;
        }

        .edit-section.activa {
            display: block;
        }

        /* Mensaje */
        #mensaje {
            color: #f87171;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand">
                <i class="fa-solid fa-bolt text-primary me-1"></i> X-App
            </div>
            <div>
                <a href="inicio.html"><i class="fa-solid fa-house me-1"></i> Inicio</a>
                <a href="perfil.html"><i class="fa-regular fa-user me-1"></i> Mi Perfil</a>
                <a href="moderacion.html" id="linkModeracion" style="display:none;">
                    <i class="fa-solid fa-shield-halved me-1"></i> Reportes
                </a>
                <a href="#" id="btnLogout"><i class="fa-solid fa-right-from-bracket me-1"></i> Salir</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <div class="glass-card">

                    <!-- ========== VISTA PERFIL ========== -->
                    <div id="vistaPerfil">
                        <div class="avatar-big" id="avatarContainer">?</div>
                        <div class="profile-name" id="nombreCompleto">Cargando...</div>
                        <div class="profile-email" id="correoUsuario"></div>
                        <div class="profile-bio" id="biografiaUsuario"></div>

                        <div class="d-flex gap-2 justify-content-center">
                            <button class="btn-gradient" id="btnEditar">
                                Editar Perfil
                            </button>
                            <button class="btn-danger-soft" id="btnEliminar">
                                Eliminar Cuenta
                            </button>
                        </div>
                    </div>

                    <!-- ========== VISTA EDICIÓN ========== -->
                    <div id="vistaEdicion" class="edit-section">
                        <h4 class="text-white mb-4"><i class="fa-solid fa-user-pen me-2"></i>Editar Perfil</h4>

                        <form id="formEditar">
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="editNombre" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" id="editApellido" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Biografía</label>
                                <textarea id="editBiografia" class="form-control" rows="3"
                                    placeholder="Cuéntanos algo sobre ti..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Avatar (URL de imagen)</label>
                                <input type="text" id="editAvatar" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nueva Contraseña (opcional)</label>
                                <input type="password" id="editPassword" class="form-control"
                                    placeholder="Dejar vacío para no cambiar">
                            </div>

                            <div id="mensajeEdicion"></div>

                            <div class="d-flex gap-2 mt-3">
                                <button type="submit" class="btn-gradient flex-fill">Guardar Cambios</button>
                                <button type="button" class="btn-danger-soft" id="btnCancelar">Cancelar</button>
                            </div>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="../JS/perfil.js"></script>
</body>

</html>
